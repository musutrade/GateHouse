schema: spec-driven

# Project context
context: |
  Project: Harness-Gate - Reusable Rust development workflow and architecture guard CLI
  Tech stack: Rust, TOML configuration, Git integration
  Primary platforms: Linux (production), macOS/Windows (development)

  Code conventions:
  - Use conventional commits (feat:, fix:, docs:, refactor:, test:, chore:)
  - All commits co-authored with: Claude Opus 5 (1M context) <noreply@anthropic.com>
  - Code must pass: cargo fmt, cargo clippy, cargo test
  - Test coverage target: >80%

  Architecture:
  - CLI built with clap
  - Error handling with anyhow/thiserror
  - Configuration via TOML (serde)
  - Git operations via Command/git CLI
  - Modular design: audit, secrets, verify, scope modules

  Domain: Development workflow automation, quality gates, security scanning

  Current phase: Phase 1 complete (CI fixes), Phase 2 proposed (performance optimization)

# Per-artifact rules
rules:
  proposal:
    - Keep proposals concise but comprehensive
    - Always include "Goals", "Non-goals", "Success Metrics"
    - Consider performance, security, and maintainability impacts
    - Link to related ADRs and existing specs
    - Include risk assessment (High/Medium/Low)
  spec:
    - Include implementation plan with timeline
    - Define clear success criteria
    - Add code examples for technical changes
    - Document alternatives considered
    - Include rollback plan for risky changes
  tasks:
    - Break tasks into <4 hour chunks
    - Each task must have clear acceptance criteria
    - Link tasks to parent spec or proposal
    - Tag with priority (P0/P1/P2) and effort (S/M/L)

# Per-operation guidance
operations:
  apply:
    guidance:
      - Run tests after each significant change
      - Use cargo fmt and cargo clippy before committing
      - Keep commits atomic and well-described
      - Update relevant documentation
      - Add benchmark results for performance changes
  archive:
    guidance:
      - Summarize what was accomplished vs planned
      - Document any deviations from the spec
      - Note lessons learned and blockers encountered
      - Update related ADRs if decisions changed
      - Link to merged PRs and related issues
