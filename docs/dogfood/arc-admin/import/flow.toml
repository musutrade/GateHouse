log = "frontend_format.log"
profiles = [
    "full",
    "hook",
]
program = "npm"
timeout_secs = 180

[[steps]]
args = [
    "test",
    "--",
    "--watch=false",
    "--runner=vitest",
]
component = "frontend"
cwd = "{frontend}"
id = "frontend.tests"
input = "repository"
label = "frontend tests"
log = "frontend_tests.log"
parser = "angular"
profiles = ["full"]
program = "npm"
timeout_env = "ANGULAR_TEST_TIMEOUT"
