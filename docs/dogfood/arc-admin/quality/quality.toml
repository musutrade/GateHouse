[profiles.full]
assurance = "complete"
collectors = [
    "backend",
    "frontend",
    "frontend-api",
]
policies = [
    "backend.coverage.line",
    "backend.coverage.region",
    "backend.risk.crap",
    "frontend-api.contract.breaking_changes",
    "frontend-api.contract.client_drift",
    "frontend-api.contract.compatible",
    "frontend.coverage.function",
    "frontend.coverage.line",
    "frontend.risk.crap",
]

[profiles.full.workflow]
baseline_request = ".harness-gate/runtime/full-baseline-request.json"
state = ".harness-gate/runtime/full-state.json"
trusted_keys = ".harness-gate/runtime/trusted-keys.json"

[profiles.hook]
assurance = "partial"
collectors = []
policies = []

[profiles.hook.workflow]
state = ".harness-gate/runtime/hook-state.json"
trusted_keys = ".harness-gate/runtime/trusted-keys.json"

[baseline]
required = true

[baseline.provider]
kind = "git"
reference = "origin/main"
merge_base = true

[reporting]
output = ".harness-gate/reports/quality"
formats = [
    "human",
    "json",
]
