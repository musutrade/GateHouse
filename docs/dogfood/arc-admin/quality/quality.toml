rule = "frontend-api.contract.compatible"

[policies."frontend-api.contract.compatible".expectation]
capability = "contract.compatible"
series = "measurement-series/v1:0b7ab5d8cf69f7a5fcd4df7e7ffe8acb0483d92a67cabcf3eafc3c05adce78ae"

