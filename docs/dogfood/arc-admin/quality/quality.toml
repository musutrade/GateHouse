# Arc-Admin shadow configuration; install beside the GH-202 imported flow.
# Reference capabilities are setup metadata, never evidence for Arc-Admin source.
version = 1

[project]
id = "arc-admin"
name = "arc-admin"

[components.backend]
flow_components = ["backend"]
source_roots = ["backend/src"]
artifact_root = ".harness-gate/reports/evidence/backend"

[components.frontend]
flow_components = ["frontend"]
source_roots = ["frontend/src"]
artifact_root = ".harness-gate/reports/evidence/frontend"

[subjects]

[relationships.frontend-api]
kind = "api-contract"

[relationships.frontend-api.from]
kind = "component"
id = "frontend"

[relationships.frontend-api.to]
kind = "component"
id = "backend"

[collectors.backend]
protocol = "harness-collector-request/v1"
request = ".harness-gate/runtime/backend-request.json"

[[collectors.backend.produces]]
capability = "coverage.line"
series = "measurement-series/v1:4fa98f3128d8c3ac0dd5279ba9b4f4f9ae83cc3538575cfd5a6be1599a95dd98"

[collectors.backend.produces.target]
kind = "component"
id = "backend"

[[collectors.backend.produces]]
capability = "coverage.region"
series = "measurement-series/v1:4fa98f3128d8c3ac0dd5279ba9b4f4f9ae83cc3538575cfd5a6be1599a95dd98"

[collectors.backend.produces.target]
kind = "component"
id = "backend"

[[collectors.backend.produces]]
capability = "risk.crap"
series = "measurement-series/v1:4fa98f3128d8c3ac0dd5279ba9b4f4f9ae83cc3538575cfd5a6be1599a95dd98"

[collectors.backend.produces.target]
kind = "component"
id = "backend"

[collectors.frontend]
protocol = "harness-collector-request/v1"
request = ".harness-gate/runtime/frontend-request.json"

[[collectors.frontend.produces]]
capability = "coverage.line"
series = "measurement-series/v1:aafce3307210d37f5a1a09f98a7b33b04dfb34e4a269a4d2b78feadf349ff6f1"

[collectors.frontend.produces.target]
kind = "component"
id = "frontend"

[[collectors.frontend.produces]]
capability = "coverage.function"
series = "measurement-series/v1:aafce3307210d37f5a1a09f98a7b33b04dfb34e4a269a4d2b78feadf349ff6f1"

[collectors.frontend.produces.target]
kind = "component"
id = "frontend"

[[collectors.frontend.produces]]
capability = "risk.crap"
series = "measurement-series/v1:aafce3307210d37f5a1a09f98a7b33b04dfb34e4a269a4d2b78feadf349ff6f1"

[collectors.frontend.produces.target]
kind = "component"
id = "frontend"

[collectors.frontend-api]
protocol = "harness-collector-request/v1"
request = ".harness-gate/runtime/frontend-api-request.json"

[[collectors.frontend-api.produces]]
capability = "contract.breaking_changes"
series = "measurement-series/v1:0b7ab5d8cf69f7a5fcd4df7e7ffe8acb0483d92a67cabcf3eafc3c05adce78ae"

[collectors.frontend-api.produces.target]
kind = "relationship"
id = "frontend-api"

[[collectors.frontend-api.produces]]
capability = "contract.client_drift"
series = "measurement-series/v1:0b7ab5d8cf69f7a5fcd4df7e7ffe8acb0483d92a67cabcf3eafc3c05adce78ae"

[collectors.frontend-api.produces.target]
kind = "relationship"
id = "frontend-api"

[[collectors.frontend-api.produces]]
