[policies."backend.coverage.line".expectation.target]
kind = "component"
id = "backend"

[policies."backend.coverage.region"]
policy_file = ".harness-gate/packs/backend/policy.json"
rule = "backend.coverage.region"

[policies."backend.coverage.region".expectation]
capability = "coverage.region"
series = "measurement-series/v1:4fa98f3128d8c3ac0dd5279ba9b4f4f9ae83cc3538575cfd5a6be1599a95dd98"

[policies."backend.coverage.region".expectation.target]
