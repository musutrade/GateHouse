coverage:
  status:
    project:
      default:
        target: 70%           # Target overall coverage
        threshold: 5%         # Allow 5% drop before failing
    patch:
      default:
        target: 50%           # New code should have at least 50% coverage
        threshold: 10%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "tools/harness-gate/target"
  - "tools/harness-gate/tests"
