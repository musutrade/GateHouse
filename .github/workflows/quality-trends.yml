name: Quality Trends

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-trends-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: tarpaulin
          profiles: 'instrumented;default'
          cache-target: 'false'

      - name: Install tarpaulin
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        # The full CLI corpus spawns Rust subprocesses through Python. LLVM
        # instrumentation avoids ptrace overhead while retaining those tests.
        run: cargo tarpaulin --manifest-path tools/harness-gate/Cargo.toml --locked --engine llvm --timeout 300 --out Xml --output-dir "$GITHUB_WORKSPACE/coverage"

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  quality-baseline:
    name: Quality Performance Baseline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: performance
          profiles: 'release-small,test;default;cold'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Capture benchmark and size baseline
        run: python tools/quality/benchmarks.py --output target/quality/benchmarks.json --samples 5

      - name: Upload baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-baseline-${{ matrix.os }}-${{ github.run_id }}
          path: target/quality
          if-no-files-found: warn

