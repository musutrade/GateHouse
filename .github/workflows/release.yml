name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Verify release eligibility
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Fetch protected main reference
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify tag, protected main, and exact CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          # Historical versions retain their original repository and signer.
          if [[ "$TAG" =~ ^v0\.([0-3]\.[0-9]+|4\.[0-8])(-|\+|$) ]]; then
            printf 'Core versions through v0.4.8 belong to the archived Harness-Gate release identity.\n' >&2
            exit 1
          fi
          python tools/release/release_policy.py verify \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --manifest tools/harness-gate/Cargo.toml \
            --output target/release-policy.json

      - name: Upload release policy evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-policy-${{ github.run_id }}
          path: target/release-policy.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build (${{ matrix.target }})
    needs: policy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: harness-gate
            asset_name: harness-gate-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: harness-gate.exe
            asset_name: harness-gate-windows-amd64.exe

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --profile release-small --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: cp tools/harness-gate/target/${{ matrix.target }}/release-small/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload release asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Release quality gates
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Run locked tests
        run: cargo test --manifest-path tools/harness-gate/Cargo.toml --locked

      - name: Check formatting
        run: cargo fmt --manifest-path tools/harness-gate/Cargo.toml -- --check

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-audit

      - name: Preflight registry package before GitHub publication
        run: cargo publish --manifest-path tools/harness-gate/Cargo.toml --package harness-gate --locked --dry-run

      - name: Run dependency audit
        run: cargo audit --file tools/harness-gate/Cargo.lock --deny warnings

      - name: Verify generated schema and release fixture
        run: |
          cargo run --manifest-path tools/harness-gate/Cargo.toml --locked -- schema export
          git diff --exit-code -- schema/flow.schema.json
          python3 -m unittest discover -s tools/release/tests -v

      - name: Verify CLI contracts
        run: python3 tools/quality/contracts.py --structured

      - name: Verify installer integrity contracts
        run: bash tools/release/tests/test_install.sh

      - name: Verify documentation consistency
        run: python3 tools/quality/docs_consistency.py

  publish:
    name: Publish signed release
    runs-on: ubuntu-latest
    needs: [policy, build, quality]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check registry publishing credential before release publication
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/release/check-registry-credentials.sh

      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          # Keep the policy evidence artifact out of the publication dist.
          # Include only the four tested Core platform binaries.
          pattern: release-harness-gate-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path tools/harness-gate/Cargo.toml --locked --format-version 1 > /tmp/harness-gate-cargo-metadata.json
          python tools/release/generate-sbom.py \
            --metadata /tmp/harness-gate-cargo-metadata.json \
            --lockfile tools/harness-gate/Cargo.lock \
            --output dist/harness-gate.sbom.cdx.json

      - name: Generate release inventory
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/release/release_inventory.py generate \
            --dist dist \
            --output dist/release-inventory.json \
            --binary harness-gate-linux-amd64 \
            --binary harness-gate-macos-amd64 \
            --binary harness-gate-macos-arm64 \
            --binary harness-gate-windows-amd64.exe \
            --sbom harness-gate.sbom.cdx.json \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --repository "$REPOSITORY"

      - name: Generate checksum manifest from inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/release/release_inventory.py checksums \
            --dist dist \
            --inventory dist/release-inventory.json

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign release metadata
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            cosign sign-blob --yes \
              --output-signature "dist/${name}.sig" \
              --output-certificate "dist/${name}.crt" \
              "dist/${name}"
          done < <(python tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation sign)

      - name: Verify release signatures from inventory
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            cosign verify-blob \
              --signature "dist/${name}.sig" \
              --certificate "dist/${name}.crt" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp 'https://github.com/musutrade/GateHouse/.github/workflows/release.yml@refs/tags/v.*' \
              "dist/${name}"
          done < <(python tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation sign)

      - name: Prepare attestation subject set
        id: attestation-subjects
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'subject_path<<HARNESS_GATE_SUBJECTS'
            while IFS= read -r name; do
              echo "dist/${name}"
            done < <(python tools/release/release_inventory.py list \
              --inventory dist/release-inventory.json --operation attest)
            echo 'HARNESS_GATE_SUBJECTS'
          } >> "$GITHUB_OUTPUT"

      - name: Attest inventory subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.attestation-subjects.outputs.subject_path }}

      - name: Verify provenance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            gh attestation verify "dist/${name}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              >/dev/null
          done < <(python tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation attest)

      - name: Verify exact release inventory
        shell: bash
        run: |
          set -euo pipefail
          verify_args=(verify --dist dist --inventory dist/release-inventory.json)
          while IFS= read -r name; do
            verify_args+=(--attested "$name")
          done < <(python tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation attest)
          python tools/release/release_inventory.py "${verify_args[@]}"

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          upload_paths=()
          while IFS= read -r name; do
            upload_paths+=("dist/${name}")
          done < <(python tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation upload)
          notes_args=(--generate-notes)
          notes_file="docs/releases/${TAG#v}.zh-CN.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$TAG" --verify-tag "${notes_args[@]}" "${upload_paths[@]}"

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check registry publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/release/check-registry-credentials.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path tools/harness-gate/Cargo.toml --package harness-gate --locked
