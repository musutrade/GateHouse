name: Runtime Protocol Release

on:
  push:
    tags:
      - 'protocol-v*'

permissions:
  contents: read

concurrency:
  group: runtime-protocol-registry-publication
  cancel-in-progress: false

jobs:
  policy:
    name: Verify release eligibility
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Fetch protected main reference
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify tag, protected main, and exact CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          test "$COMMIT" = "$(git rev-parse refs/remotes/origin/main)"
          python tools/release/release_policy.py verify \
            --tag "$TAG" --tag-prefix protocol-v \
            --commit "$COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --manifest tools/harness-gate/runtime-protocol/Cargo.toml \
            --output target/release-policy.json

      - name: Upload release policy evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-policy-${{ github.run_id }}
          path: target/release-policy.json
          if-no-files-found: error
          retention-days: 90

  protocol-publish:
    name: Publish pinned runtime protocol
    runs-on: ubuntu-latest
    needs: policy
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check registry publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash tools/release/check-registry-credentials.sh
      - name: Publish or verify immutable protocol package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/release/publish_runtime_protocol.py

