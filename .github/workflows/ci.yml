name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  classify:
    name: Classify change
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reuse_verified: ${{ steps.reuse.outputs.reuse_verified || 'false' }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      files: ${{ steps.classify.outputs.files }}
      run_evidence: ${{ steps.classify.outputs.run_evidence }}
      run_native: ${{ steps.classify.outputs.run_native }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Record PR equivalence receipt
        if: github.event_name == 'pull_request'
        run: >-
          python3 -I tools/quality/ci_reuse.py record
          --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output target/quality/ci-reuse/receipt.json

      - name: Upload PR equivalence receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/ci-reuse/receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify prior PR checks for equivalent push
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/quality/ci_reuse.py probe
          --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
          --sha "$GITHUB_SHA" --output target/quality/ci-reuse-proof.json
          --github-output "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD="${{ github.sha }}"
            BASE="$(python3 tools/quality/ci_quality.py certified-base --head-sha "$HEAD")"
          else
            BASE=""; HEAD=""
          fi
          BASE="$(python3 tools/maintenance/migration_baseline.py --base "$BASE" --head "$HEAD" --fetch)"
          python3 tools/maintenance/repository_size.py --base-sha "$BASE" --head-sha "$HEAD" \
            --output target/quality/repository-size.json
          python3 tools/quality/ci_quality.py classify --base-sha "$BASE" --head-sha "$HEAD" \
            --github-output "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test,dev;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          HARNESS_GATE_CI_ACCEPTANCE: ${{ github.workspace }}/target/quality/workflow-acceptance
        run: cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked

      - name: Test findings feedback integration without publishing
        run: node --test .github/actions/findings-feedback/feedback.test.cjs

      - name: Validate configured workflow acceptance
        run: python3 tools/quality/ci_acceptance.py --directory target/quality/workflow-acceptance

      - name: Upload configured workflow acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/workflow-acceptance/
          if-no-files-found: error
          retention-days: 30

      - name: Verify generated configuration schema
        run: |
          cargo run --manifest-path tools/harness-gate/Cargo.toml -- schema export
          cargo run --manifest-path tools/harness-gate/Cargo.toml --locked -- schema export --quality
          git diff --exit-code -- schema/flow.schema.json schema/quality.schema.json

      - name: Fetch reviewed GateProbes onboarding implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: musutrade/GateProbes
          ref: 53c01505bed2ff61dfad1d106abbec2dcd961d05
          path: .plugin-onboarding
          persist-credentials: false

      - name: Real locked Rust and Python onboarding against this Core
        run: |
          set -euo pipefail
          core_target="$(cargo metadata --manifest-path tools/harness-gate/Cargo.toml --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          python3 -B .plugin-onboarding/tools/onboarding/acceptance.py \
            --core "$core_target/debug/harness-gate" --work-dir "$RUNNER_TEMP/plugin-onboarding"

      - name: Retain real plugin onboarding evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-onboarding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plugin-onboarding/report.json
            ${{ runner.temp }}/plugin-onboarding/*.log
          if-no-files-found: warn
          retention-days: 30

  test-cross-platform:
    name: Test (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked --no-fail-fast

  security-audit:
    name: Security Audit
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings
        working-directory: tools/harness-gate

  fmt:
    name: Format
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/harness-gate/Cargo.toml -- --check

  clippy:
    name: Clippy
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: clippy
          profiles: 'dev,test;all-features'

      - name: Run clippy
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked --all-targets --all-features -- -D warnings

  build:
    name: Build
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harness-gate-ubuntu-latest
          # Informational output only; no quality, release or performance consumer.
          path: ${{ env.CARGO_TARGET_DIR }}/release/harness-gate
          if-no-files-found: error

  build-cross-platform:
    name: Build (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

  quality-coverage:
    name: Quality Coverage and Critical Paths
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest-sha256: ${{ steps.seal.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Collect and require fresh coverage, risk and matrix evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CI_PARALLEL_RISK: '1'
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA" --fetch)"
          python3 tools/quality/ci_quality.py collect \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Seal immutable quality evidence
        id: seal
        run: python3 tools/quality/ci_artifact.py seal --root target/quality/candidate

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: warn

  quality-generic-shadow:
    name: Generic Quality Shadow
    # Advisory only: never add this job to quality-required's dependencies.
    if: ${{ always() && needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    needs: [classify, quality-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Download this run's retained Rust candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/candidate

      - name: Verify artifact identity and hashes before consumption
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.quality-coverage.outputs.manifest-sha256 }}
        run: |
          python3 tools/quality/ci_artifact.py verify --root target/quality/candidate \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --output target/quality/artifact-validation.json

      - name: Project and compare retained evidence
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          python3 tools/quality/rust_reference.py \
            --candidate target/quality/candidate/candidate.json \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/generic-shadow

      - name: Upload generic projection and compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-generic-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/generic-shadow/*.json
            target/quality/artifact-validation.json
          if-no-files-found: error

  quality-contracts:
    name: Quality CLI Contracts
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Run CLI contract snapshots
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tools/quality/contracts.py --output target/quality/contracts.json
          else
            python tools/quality/contracts.py --output target/quality/contracts.json --structured
          fi

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-contracts-ubuntu-latest-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  quality-contracts-cross-platform:
    name: Quality CLI Contracts (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Run CLI contract snapshots
        shell: bash
        run: python tools/quality/contracts.py --output target/quality/contracts.json --structured

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  docs-consistency:
    name: Documentation Consistency
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        if: needs.classify.outputs.run_full == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        if: needs.classify.outputs.run_full == 'true'
        uses: ./.github/actions/cargo-state
        with:
          class: docs
          profiles: 'dev;default'

      - name: Check documentation, examples, and schema
        env:
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
        run: |
          set -euo pipefail
          if [ "$RUN_FULL" = "true" ]; then
            python3 tools/quality/docs_consistency.py --output target/quality/docs-consistency.json
          else
            python3 tools/quality/docs_consistency.py --pure --output target/quality/docs-consistency.json
          fi

      - name: Upload documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-consistency-${{ github.run_id }}
          path: target/quality/docs-consistency.json
          if-no-files-found: warn

  release-contracts:
    name: Release Governance Contracts
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Run release policy and inventory contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/release/tests -v
          bash tools/release/tests/test_install.sh

  quality-scripts:
    name: Quality Script Tests
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust coverage tools for measurement contract tests
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality-scripts
          profiles: 'fixture-owned'
          cache-target: 'false'

      - name: Test and compile quality scripts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Verify accepted delegation and physical cleanup in the real checkout.
          python3 tools/quality/tests/run_core.py --list > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/quality')
          from core_isolation_check import check_source_cleanup
          check_source_cleanup(Path.cwd())
          PY
          python3 tools/quality/tests/run_core.py
          python3 -m py_compile tools/quality/*.py tools/quality/tests/*.py

  quality-required:
    name: Required Quality Aggregate
    if: ${{ always() }}
    # Keep this check name stable because it is required by the main ruleset.
    # Evaluation only: no product compilation, tests, coverage/risk collection,
    # or heavy Rust tool setup. The step allowlist is tested in test_ci_topology.py.
    # Impact routing defers metrics/native checks only for known ordinary paths.
    # Daily/manual runs require all gates; every missing or failed dependency blocks.
    needs:
      [classify, test, test-cross-platform, security-audit, fmt, clippy, build, build-cross-platform,
       quality-coverage, quality-contracts, quality-contracts-cross-platform,
       docs-consistency, release-contracts, quality-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Require every quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REUSE_VERIFIED: ${{ needs.classify.outputs.reuse_verified }}
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
          RUN_EVIDENCE: ${{ needs.classify.outputs.run_evidence }}
          RUN_NATIVE: ${{ needs.classify.outputs.run_native }}
        run: python3 tools/quality/ci_quality.py aggregate
