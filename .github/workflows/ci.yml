name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI only needs coverage mappings and panic messages, not full debug info.
  # Disabling dev/test debuginfo reduces compile/link time and artifact size.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  classify:
    name: Classify change
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reuse_verified: ${{ steps.reuse.outputs.reuse_verified || 'false' }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      files: ${{ steps.classify.outputs.files }}
      run_evidence: ${{ steps.classify.outputs.run_evidence }}
      run_native: ${{ steps.classify.outputs.run_native }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Record PR equivalence receipt
        if: github.event_name == 'pull_request'
        run: >-
          python3 -I tools/quality/ci_reuse.py record
          --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --output target/quality/ci-reuse/receipt.json

      - name: Upload PR equivalence receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/ci-reuse/receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify prior PR checks for equivalent push
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/quality/ci_reuse.py probe
          --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
          --sha "$GITHUB_SHA" --output target/quality/ci-reuse-proof.json
          --github-output "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD="${{ github.sha }}"
            BASE="$(python3 tools/quality/ci_quality.py certified-base --head-sha "$HEAD")"
          else
            BASE=""; HEAD=""
          fi
          BASE="$(python3 tools/maintenance/migration_baseline.py --base "$BASE" --head "$HEAD" --fetch)"
          python3 tools/maintenance/repository_size.py --base-sha "$BASE" --head-sha "$HEAD" \
            --output target/quality/repository-size.json
          python3 tools/quality/ci_quality.py classify --base-sha "$BASE" --head-sha "$HEAD" \
            --github-output "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.shard == 1 && 'Test' || format('Test (shard {0})', matrix.shard) }}
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.reuse_verified != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test,dev;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run partitioned tests
        run: >-
          cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked
          --no-fail-fast --partition count:${{ matrix.shard }}/4
          -E 'not test(configured_ci_acceptance_retains_parity_reuse_and_negative_evidence)
          and not test(html_export_combined_thousand_subjects_preserves_fail_and_rejects_tampering)'

      - name: Run runtime protocol contract tests
        if: matrix.shard == 1
        run: >-
          cargo test --manifest-path tools/harness-gate/Cargo.toml --locked
          -p gatehouse-runtime-protocol --target-dir "$RUNNER_TEMP/runtime-protocol-target"

      - name: Run musl protected Podman context regressions
        if: matrix.shard == 1
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo test --manifest-path tools/harness-gate/Cargo.toml --locked \
            -p gatehouse-runtime-protocol --target x86_64-unknown-linux-musl \
            --target-dir "$RUNNER_TEMP/runtime-protocol-musl-target" \
            lifecycle_v2::protected_context::tests -- --test-threads=2

      - name: Run CI acceptance and HTML example tests
        if: matrix.shard == 1
        env:
          HARNESS_GATE_CI_ACCEPTANCE: ${{ github.workspace }}/target/quality/workflow-acceptance
          HG_HTML_ACCEPTANCE_DIR: ${{ runner.temp }}/gatehouse-html-example
          HG_HTML_ACCEPTANCE_COMMIT: ${{ github.sha }}
        run: >-
          cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked
          --no-fail-fast
          -E 'test(configured_ci_acceptance_retains_parity_reuse_and_negative_evidence)
          or test(html_export_combined_thousand_subjects_preserves_fail_and_rejects_tampering)'

      - name: Pin the generated synthetic HTML export
        if: matrix.shard == 1
        id: html-example
        env:
          HTML_EXPORT: ${{ runner.temp }}/gatehouse-html-example
        run: |
          node - <<'JS'
          const fs = require('node:fs'), crypto = require('node:crypto'), path = require('node:path');
          const bytes = fs.readFileSync(path.join(process.env.HTML_EXPORT, 'provenance.json'));
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${digest}\n`);
          JS

      - name: Upload synthetic report UI example (not repository quality evidence)
        if: matrix.shard == 1
        id: html-artifact
        uses: musutrade/GateProbes/plugins/github-actions/actions/report-artifact@fffe3589e8920d14aba4e47338d316ecdbb3ba14 # github-actions-v1.0.0
        with:
          directory: ${{ runner.temp }}/gatehouse-html-example
          provenance-sha256: ${{ steps.html-example.outputs.digest }}
          commit: ${{ github.sha }}
          upload: 'true'
          retention-days: '7'

      - name: Validate configured workflow acceptance
        if: matrix.shard == 1
        run: python3 tools/quality/ci_acceptance.py --directory target/quality/workflow-acceptance

      - name: Upload configured workflow acceptance
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/workflow-acceptance/
          if-no-files-found: error
          retention-days: 30

      - name: Verify generated configuration schema
        if: matrix.shard == 1
        run: |
          cargo run --manifest-path tools/harness-gate/Cargo.toml -- schema export
          cargo run --manifest-path tools/harness-gate/Cargo.toml --locked -- schema export --quality
          git diff --exit-code -- schema/flow.schema.json schema/quality.schema.json

      - name: Compatibility fetch guard tests
        if: matrix.shard == 1
        run: python3 -B -m unittest discover -s tools/compatibility/tests -v

      - name: Fetch digest-pinned external compatibility distributions
        if: matrix.shard == 1
        run: python3 -B tools/compatibility/fetch_artifacts.py --output "$RUNNER_TEMP/gateprobes-artifacts"

      - name: Core paired-identity and boundary contracts with released consumer
        if: matrix.shard == 1
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          core_target="$(cargo metadata --manifest-path tools/harness-gate/Cargo.toml --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          test -x "$core_target/debug/harness-gate"
          GATEHOUSE_CORE="$core_target/debug/harness-gate" \
          GATEPROBES_CONSUMER="$RUNNER_TEMP/gateprobes-artifacts/gateprobes-github-check-1.0.0/github_check.py" \
            python3 -m unittest discover -s tools/compatibility/result_boundary -v

      - name: Real locked Rust and Python onboarding against this Core
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          core_target="$(cargo metadata --manifest-path tools/harness-gate/Cargo.toml --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          prefix="$(python3 -c 'import json; print(json.load(open("tools/compatibility/artifacts.json"))["artifacts"]["onboarding-presets"]["prefix"])')"
          python3 -B "$RUNNER_TEMP/gateprobes-artifacts/$prefix/tools/onboarding/acceptance.py" \
            --core "$core_target/debug/harness-gate" --work-dir "$RUNNER_TEMP/plugin-onboarding"

      - name: Retain real plugin onboarding evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-onboarding-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plugin-onboarding/report.json
            ${{ runner.temp }}/plugin-onboarding/*.log
          if-no-files-found: warn
          retention-days: 30

  test-cross-platform:
    name: ${{ matrix.shard == 1 && format('Test ({0})', matrix.os) || format('Test ({0}, shard {1})', matrix.os, matrix.shard) }}
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Preserve the existing required check name while splitting the test
        # list across 4 identical shards per OS to reduce wall-clock time.
        # macOS and Windows native compile/test costs are balanced at 4 workers each.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data
        with:
          groups: arc-admin-replay regression-corpus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run tests
        shell: bash
        env:
          CI_OS: ${{ matrix.os }}
          CI_SHARD: ${{ matrix.shard }}
          CI_PARTITIONS: 4
        run: |
          set -euo pipefail
          excluded=''
          extra=''
          if [ "$CI_OS" = 'macos-latest' ]; then
            excluded='test(frozen_policy_and_reference_acceptance_match_python)'
            if [ "$CI_SHARD" = '1' ]; then
              extra="$excluded"
            fi
          elif [ "$CI_OS" = 'windows-latest' ]; then
            excluded='test(large_core_quality_json_is_redacted_and_finalized_without_truncation) | test(frozen_evidence_and_integrity_matrix_matches_python)'
            # Distribute heavyweight tests across shards 1 and 3 to balance load
            if [ "$CI_SHARD" = '1' ]; then
              extra='test(large_core_quality_json_is_redacted_and_finalized_without_truncation)'
            elif [ "$CI_SHARD" = '3' ]; then
              extra='test(frozen_evidence_and_integrity_matrix_matches_python)'
            fi
          fi
          if [ -n "$excluded" ]; then
            cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked \
              --no-fail-fast --partition "count:${CI_SHARD}/${CI_PARTITIONS}" \
              -E "not ($excluded)"
          else
            cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked \
              --no-fail-fast --partition "count:${CI_SHARD}/${CI_PARTITIONS}"
          fi
          if [ -n "$extra" ]; then
            cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked \
              --no-fail-fast -E "$extra"
          fi


      - name: Repeat final cancellation boundary on Windows
        if: matrix.os == 'windows-latest' && matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/quality/windows-cancellation
          for sample in $(seq 1 10); do
            cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked \
              --no-fail-fast --no-tests fail -E 'test(=process::adapter::tests::final_boundary_cancellation_rejects_a_valid_zero_exit_response)' \
              2>&1 | tee "target/quality/windows-cancellation/sample-${sample}.log"
          done

      - name: Retain Windows cancellation samples
        if: always() && matrix.os == 'windows-latest' && matrix.shard == 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-cancellation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/windows-cancellation/
          if-no-files-found: warn

  security-audit:
    name: Security Audit
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings
        working-directory: tools/harness-gate

  fmt:
    name: Format
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --manifest-path tools/harness-gate/Cargo.toml -- --check

  clippy:
    name: Clippy
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: clippy
          profiles: 'dev,test;all-features'

      - name: Run clippy
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Run clippy for the runtime protocol crate
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked -p gatehouse-runtime-protocol --all-targets --all-features -- -D warnings

  build:
    name: Build
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harness-gate-ubuntu-latest
          # Informational output only; no quality, release or performance consumer.
          path: ${{ env.CARGO_TARGET_DIR }}/release/harness-gate
          if-no-files-found: error

  build-cross-platform:
    name: Build (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        # Fast native compile check; Linux Build retains the original release profile.
        # Release artifacts and benchmarks use their separate release-small profile.
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

  # Fast baseline stages are collected from a single instrumented archive.
  # The archive removes repeated compilation from the test shards while four
  # independent runners execute the legacy coverage suite in parallel.
  quality-fast-build:
    name: Build Fast Coverage Archive
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Build pinned lifecycle joint fixture
        run: |
          python3 -B tools/quality/lifecycle_fixture.py build \
            --crate tools/harness-gate \
            --bundle target/quality/fast-archive/lifecycle \
            --work "$RUNNER_TEMP/lifecycle-build"

      - name: Build instrumented nextest archive
        shell: bash
        run: |
          set -euo pipefail
          cd tools/harness-gate
          mkdir -p "$GITHUB_WORKSPACE/target/quality/fast-archive"
          archive="$GITHUB_WORKSPACE/target/quality/fast-archive/tests.tar.zst"
          eval "$(cargo llvm-cov show-env --sh --manifest-path Cargo.toml)"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/quality/fast-build-target"
          mkdir -p "$CARGO_TARGET_DIR"
          cargo nextest archive --workspace --locked --features harness-gate/lifecycle-joint-tests,harness-gate/podman-capture-joint-tests --archive-file "$archive" \
            > "$GITHUB_WORKSPACE/target/quality/fast-archive/build.log" 2>&1

      - name: Upload fast coverage archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-fast-archive-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/fast-archive/tests.tar.zst
            target/quality/fast-archive/build.log
            target/quality/fast-archive/lifecycle/
          if-no-files-found: error

  quality-fast-shard:
    name: Fast Coverage Shard (${{ matrix.shard }}/4)
    needs: [classify, quality-fast-build]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Download fast coverage archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: quality-fast-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/fast-archive

      - name: Verify lifecycle fixture and private journal root
        run: |
          python3 -B tools/quality/lifecycle_fixture.py activate \
            --crate tools/harness-gate \
            --bundle target/quality/fast-archive/lifecycle \
            --journal "$HOME/.gatehouse-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}" \
            --env-file "$GITHUB_ENV"

      - name: Run fast coverage shard
        shell: bash
        env:
          FAST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd tools/harness-gate
          # The archive bakes CARGO_BIN_EXE paths from the build job. Reuse
          # that exact target path and make extracted debug binaries visible
          # there before cargo-llvm-cov re-extracts the archive.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/quality/fast-build-target"
          rm -rf "$CARGO_TARGET_DIR"
          mkdir -p "$CARGO_TARGET_DIR/llvm-cov-target"
          archive="$GITHUB_WORKSPACE/target/quality/fast-archive/tests.tar.zst"
          tar --zstd -xf "$archive" -C "$CARGO_TARGET_DIR/llvm-cov-target"
          ln -s llvm-cov-target/target/debug "$CARGO_TARGET_DIR/debug"
          mkdir -p "$GITHUB_WORKSPACE/target/quality/fast-profdata"
          log="$GITHUB_WORKSPACE/target/quality/fast-profdata/fast-shard-${FAST_SHARD}.log"
          cargo llvm-cov nextest \
            --archive-file "$archive" \
            --workspace-remap "$GITHUB_WORKSPACE/tools/harness-gate" \
            --extract-overwrite --no-fail-fast \
            --partition "count:${FAST_SHARD}/4" --no-report > "$log" 2>&1
          llvm_profdata="$(dirname "$(rustc --print target-libdir)")/bin/llvm-profdata"
          "$llvm_profdata" merge -sparse "$CARGO_TARGET_DIR"/llvm-cov-target/*.profraw \
            -o "$GITHUB_WORKSPACE/target/quality/fast-profdata/fast-shard-${FAST_SHARD}.profdata"

      - name: Upload fast coverage profdata
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-fast-profdata-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/fast-profdata/fast-shard-${{ matrix.shard }}.profdata
            target/quality/fast-profdata/fast-shard-${{ matrix.shard }}.log
          if-no-files-found: error

  # Fast baseline stages (legacy + production)
  quality-fast:
    name: Quality Fast Stages (legacy, production)
    needs: [classify, quality-fast-build, quality-fast-shard]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Download fast coverage archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: quality-fast-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/fast-archive

      - name: Download fast coverage profiles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: quality-fast-profdata-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/fast-profdata
          merge-multiple: true

      - name: Assemble fast coverage stages
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA" --fetch)"
          python3 tools/quality/ci_quality.py assemble-fast-coverage \
            --archive target/quality/fast-archive/tests.tar.zst \
            --profdata-root target/quality/fast-profdata --partitions 4 \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Record shard tool identity (fast)
        run: |
          python3 tools/quality/ci_quality.py tool-identity \
            --output target/quality/candidate/tool-identity.json

      - name: Upload quality artifacts (fast)
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-artifacts-fast-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: error

  # Risk analysis stage. Base and head run in independent hosted runners so
  # coverage compilation never competes with its sibling for two CPU cores.
  quality-risk:
    name: Quality Risk Stage (${{ matrix.side }}, shard ${{ matrix.shard }}/4)
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Collect risk stage (${{ matrix.side }}, shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RISK_SIDE: ${{ matrix.side }}
          RISK_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$RISK_SIDE" = 'head' ]; then
            excluded='test(frozen_policy_and_reference_acceptance_match_python)'
          else
            excluded='test(html_export_combined_thousand_subjects_preserves_fail_and_rejects_tampering) | test(cow_no_hit_borrows_and_mixed_replacements_match_frozen_g_bytes) | test(waiter_terminates_on_writer_failure_and_observed_output_limits)'
          fi
          extra=''
          if [ "$RISK_SHARD" = '1' ]; then
            extra="$excluded"
          fi
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA" --fetch)"
          python3 tools/quality/ci_quality.py collect-risk-shard \
            --side "$RISK_SIDE" --risk-shard "$RISK_SHARD" --partitions 4 \
            --exclude-tests "$excluded" --extra-tests "$extra" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Record shard tool identity (risk-${{ matrix.side }}-${{ matrix.shard }})
        run: |
          python3 tools/quality/ci_quality.py tool-identity \
            --output target/quality/candidate/tool-identity.json

      - name: Upload quality artifacts (risk-${{ matrix.side }}-${{ matrix.shard }})
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-artifacts-risk-${{ matrix.side }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: error

  # Matrix analysis stage
  quality-matrix:
    name: Quality Matrix Stage
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Collect matrix stage
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA" --fetch)"
          python3 tools/quality/ci_quality.py collect \
            --stages matrix \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Record shard tool identity (matrix)
        run: |
          python3 tools/quality/ci_quality.py tool-identity \
            --output target/quality/candidate/tool-identity.json

      - name: Upload quality artifacts (matrix)
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-artifacts-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: error

  # Merge all stages and run verify. The display name stays stable because
  # certified-base discovery (ci_quality.py) and PR-check reuse (ci_reuse.py)
  # match this exact name.
  quality-coverage:
    name: Quality Coverage and Critical Paths
    needs: [classify, quality-fast, quality-risk, quality-matrix]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest-sha256: ${{ steps.seal.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Rust
        # seal() records rustc/cargo/nextest/llvm-cov identities in the manifest.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Download quality artifacts (fast)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: quality-artifacts-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/candidate-fast

      - name: Download quality artifacts (risk shards)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: quality-artifacts-risk-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/risk-shards

      - name: Download quality artifacts (matrix)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: quality-artifacts-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/candidate-matrix

      - name: Assemble risk shards and workers
        run: |
          python3 tools/quality/ci_quality.py assemble-risk-shards \
            --shards-root target/quality/risk-shards \
            --output target/quality/candidate-risk

      - name: Retain risk comparison diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-risk-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/candidate-risk/risk-compare.log
            target/quality/candidate-risk/risk.json
          if-no-files-found: warn

      - name: Merge artifacts
        run: |
          python3 tools/quality/ci_quality.py merge \
            --output target/quality/candidate \
            --shard fast=target/quality/candidate-fast \
            --shard risk=target/quality/candidate-risk \
            --shard matrix=target/quality/candidate-matrix

      - name: Run verify stage
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA" --fetch)"
          python3 tools/quality/ci_quality.py verify \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Seal immutable quality evidence
        id: seal
        run: python3 tools/quality/ci_artifact.py seal --root target/quality/candidate

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: warn

  quality-generic-shadow:
    name: Generic Quality Shadow
    # Advisory only: never add this job to quality-required's dependencies.
    if: ${{ always() && needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_evidence != 'false' && needs.classify.outputs.reuse_verified != 'true' }}
    needs: [classify, quality-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Download this run's retained Rust candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/candidate

      - name: Verify artifact identity and hashes before consumption
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.quality-coverage.outputs.manifest-sha256 }}
        run: |
          python3 tools/quality/ci_artifact.py verify --root target/quality/candidate \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --output target/quality/artifact-validation.json

      - name: Project and compare retained evidence
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_SHA="$(python3 tools/maintenance/migration_baseline.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          python3 tools/quality/rust_reference_cached.py \
            --candidate target/quality/candidate/candidate.json \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/generic-shadow --show-stats

      - name: Upload generic projection and compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-generic-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/generic-shadow/*.json
            target/quality/artifact-validation.json
          if-no-files-found: error

  quality-contracts:
    name: Quality CLI Contracts
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Run CLI contract snapshots
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tools/quality/contracts.py --output target/quality/contracts.json
          else
            python tools/quality/contracts.py --output target/quality/contracts.json --structured
          fi

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-contracts-ubuntu-latest-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  quality-contracts-cross-platform:
    name: Quality CLI Contracts (${{ matrix.os }})
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' && needs.classify.outputs.run_native != 'false' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Run CLI contract snapshots
        shell: bash
        run: python tools/quality/contracts.py --output target/quality/contracts.json --structured

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  docs-consistency:
    name: Documentation Consistency
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust
        if: needs.classify.outputs.run_full == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Cargo state
        if: needs.classify.outputs.run_full == 'true'
        uses: ./.github/actions/cargo-state
        with:
          class: docs
          profiles: 'dev;default'

      - name: Check documentation, examples, and schema
        env:
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
        run: |
          set -euo pipefail
          if [ "$RUN_FULL" = "true" ]; then
            python3 tools/quality/docs_consistency.py --output target/quality/docs-consistency.json
          else
            python3 tools/quality/docs_consistency.py --pure --output target/quality/docs-consistency.json
          fi

      - name: Upload documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-consistency-${{ github.run_id }}
          path: target/quality/docs-consistency.json
          if-no-files-found: warn

  release-contracts:
    name: Release Governance Contracts
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Run release policy and inventory contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/release/tests -v
          bash tools/release/tests/test_install.sh

  quality-scripts:
    name: Quality Script Tests
    needs: [classify]
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Install Rust coverage tools for measurement contract tests
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality-scripts
          profiles: 'fixture-owned'
          cache-target: 'false'

      - name: Test and compile quality scripts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Verify accepted delegation and physical cleanup in the real checkout.
          python3 tools/quality/tests/run_core.py --list > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/quality')
          from core_isolation_check import check_source_cleanup
          check_source_cleanup(Path.cwd())
          PY
          python3 tools/quality/tests/run_core.py
          python3 -m py_compile tools/quality/*.py tools/quality/tests/*.py

  quality-required:
    name: Required Quality Aggregate
    if: ${{ always() }}
    # Keep this check name stable because it is required by the main ruleset.
    # Evaluation only: no product compilation, tests, coverage/risk collection,
    # or heavy Rust tool setup. The step allowlist is tested in test_ci_topology.py.
    # Impact routing defers metrics/native checks only for known ordinary paths.
    # Daily/manual runs require all gates; every missing or failed dependency blocks.
    needs:
      [classify, test, test-cross-platform, security-audit, fmt, clippy, build, build-cross-platform,
       quality-coverage, quality-contracts, quality-contracts-cross-platform,
       docs-consistency, release-contracts, quality-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Require every quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REUSE_VERIFIED: ${{ needs.classify.outputs.reuse_verified }}
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
          RUN_EVIDENCE: ${{ needs.classify.outputs.run_evidence }}
          RUN_NATIVE: ${{ needs.classify.outputs.run_native }}
        run: python3 tools/quality/ci_quality.py aggregate
