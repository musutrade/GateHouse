name: Rust Generic Shadow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  differential:
    # Opt-in advisory evidence; never a Required Quality Aggregate dependency.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUST_GENERIC_SHADOW == 'true' || (github.event_name == 'pull_request' && github.head_ref == 'symphony/GH-151' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned regression data
        uses: ./.github/actions/test-data

      - name: Bind retained evidence to the reviewed commit
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target/quality/rust-generic-shadow
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['REVIEWED_SHA']
          identity = dict(commit=commit, repository=os.environ['GITHUB_REPOSITORY'],
                          run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          pathlib.Path('target/quality/rust-generic-shadow/identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PYTHON
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Build the shipped core and migration comparator
        run: |
          cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --bin harness-gate
          cargo build --manifest-path tools/harness-gate/Cargo.toml --locked -p harness-gate-quality-core --example differential_replay
      - name: Compare retained Rust, Angular and negative cases
        run: |
          python3 tools/quality/fixtures/generic-core/authority.py \
            --harness-gate tools/harness-gate/target/debug/harness-gate \
            --rust-replay tools/harness-gate/target/debug/examples/differential_replay \
            --output target/quality/rust-generic-shadow
      - name: Retain both engines, field differences and original evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-generic-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/rust-generic-shadow/
          retention-days: 30
          if-no-files-found: error
