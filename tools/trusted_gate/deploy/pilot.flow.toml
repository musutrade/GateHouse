version = 2
[project]
name = "gatehouse-host-isolation-pilot"
default_profile = "full"
hook_profile = "hook"
[paths]
reports = ".gatehouse-host/reports"
audit_config = ".gatehouse-host/audit.toml"
secrets_config = ".gatehouse-host/secrets.toml"
[policy]
required_steps = ["pilot-boundary", "pilot-host-contracts"]
[scope]
unmatched = "all"
[[scope.rules]]
patterns = ["**"]
components = ["pilot"]
[[steps]]
id = "pilot-boundary"
label = "Live restricted worker boundary; pilot only"
component = "pilot"
profiles = ["full"]
program = "gatehouse-step"
args = ["pilot-boundary"]
cwd = "{root}"
log = "pilot-boundary.log"
timeout_secs = 60
[[steps]]
id = "pilot-host-contracts"
label = "Host transport contracts; not complete GateHouse coverage"
component = "pilot"
profiles = ["full"]
program = "gatehouse-step"
args = ["pilot-host-contracts"]
cwd = "{root}"
log = "pilot-host-contracts.log"
timeout_secs = 120
