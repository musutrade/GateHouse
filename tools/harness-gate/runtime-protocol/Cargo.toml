[package]
name = "gatehouse-runtime-protocol"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Strict data contract for pinned container runtime adapters"
repository = "https://github.com/musutrade/GateHouse"
homepage = "https://github.com/musutrade/GateHouse"
readme = "README.md"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3.27"
