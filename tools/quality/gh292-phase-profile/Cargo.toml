[package]
name = "gh292-phase-profile"
version = "0.0.0"
edition = "2021"
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = { version = "=0.10.9" }
regex = { version = "=1.13.1" }
unicode-normalization = { version = "=0.1.25" }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
thiserror = { version = "=2.0.20" }
anyhow = { version = "=1.0.104" }
libc = { version = "=0.2.189" }
[profile.release]
opt-level = 3
codegen-units = 4

[workspace]
